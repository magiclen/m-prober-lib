[package]
name = "mprober-lib"
version = "0.2.0"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/magiclen/m-prober-lib"
homepage = "https://magiclen.org/m-prober-lib"
keywords = ["linux", "probe", "proc", "sysfs", "monitor"]
categories = ["os::unix-apis"]
description = "A library aims to quickly collect Linux system information including hostname, kernel version, uptime, RTC time, load average, CPU, memory, pressure, sensors, batteries, cgroup limits, network interfaces, block devices and processes."
license = "MIT"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
libc = "0.2"
scanner-rust = "3"
chrono = "0.4"
regex = "1"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dev-dependencies]
bencher = "0.1.5"

[[bench]]
name = "bench"
harness = false
